<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Media Hub</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
  <style>
    h1 { font-family: 'Poppins', sans-serif; }
    iframe, video, embed { max-width: 100%; }
  </style>
</head>
<body>
  <h1>My Media Hub</h1>

  <h2>YouTube Video</h2>
  <iframe width="560" height="315" src="https://www.youtube.com/embed/lWt4fnK9MIo"
   title="YouTube video player"
   autoplay="0"
   controls="1"
   allowfullscreen></iframe>

  <h2>Local Video</h2>
  <video width="480" controls>
    <source src="media/clip.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <h2>Audio Clip</h2>
  <audio controls>
    <source src="audio/clip.mp3" type="audio/mp3">
    Your browser does not support the audio tag.
  </audio>

  <h2>Google Map: PCPS College, Kupondole</h2>
  <iframe width="560" height="320" style="border:0" loading="lazy" title="Map of PCPS College, Kupondole"
    src="https://www.google.com/maps?q=PCPS+College+Kupondole+Lalitpur&amp;output=embed"></iframe>

  <h2>External Webpage</h2>
  <iframe src="https://fedoramagazine.org/" width="560" height="250" title="Fedora Magazine embedded page"></iframe>

  <h2>PDF Document</h2>
  <embed src="docs/sample.pdf" type="application/pdf" width="560" height="300">
</body>
</html>
